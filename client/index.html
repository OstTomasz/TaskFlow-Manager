<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO -->
    <title>TaskFlow Manager</title>
    <meta
      name="description"
      content="A task management app built with React, Node.js, Express and MongoDB."
    />
    <meta name="author" content="Tomasz Ostaszewski" />

    <!-- Open Graph -->
    <meta property="og:title" content="TaskFlow Manager" />
    <meta
      property="og:description"
      content="A task management app built with React, Node.js, Express and MongoDB."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://task-flow-manager-client.vercel.app"
    />
    <meta
      property="og:image"
      content="https://task-flow-manager-client.vercel.app/og.png"
    />

    <style>
      html {
        transition: background-color 0.1s;
      }
    </style>
    <script>
      try {
        const stored = JSON.parse(
          localStorage.getItem("taskflow-theme") || "{}",
        );
        const theme = stored?.state?.theme;
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
